services:
  mysql:
    image: mysql:8.4
    container_name: anivault-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: anime_db

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot123 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  anivault:
    build: .

    container_name: anivault-app

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/anime_db
      SPRING_DATASOURCE_USERNAME: root
      DB_PASSWORD: root123
      JWT_SECRET: this_is_my_super_secret_key_for_anivault_2026

volumes:
  mysql-data: